delivery_mission:
  ros__parameters:
    drop_order: "1234"
    home: [3.07, -2.38]
    windows: [1.925, -0.3275, 1.925, -2.3725]
    drop_points: [1.12, -0.15, 0.02, -0.67, 0.02, -2.03, 1.12, -2.53]
    east_lane_x: 2.80
    west_lane_x: 1.05
    crossing_z: 0.74
    observe_z: 1.27
    # Release heights and horizontal lead for ballistic throws.
    throw_z: 1.05
    drop4_throw_z: 0.74
    # Match throw lead to 0.5 m/s flight so cubes clear the moving tray.
    throw_lead: 0.22
    land_z: 0.20
    # Limit actual 3D flight speed, including ascent/descent, to 0.5 m/s.
    # Measured simulator displacement is 2x the velocity command.
    max_speed: 0.5
    sim_velocity_gain: 2.0
    delivery_speed: 0.25
    cruise_speed: 0.25
    crossing_speed: 0.25
    waypoint_timeout: 90.0
    detection_timeout: 35.0
    sensor_timeout: 3.0
    lidar_enabled: true
    # 0.70 m footprint, lower skid -0.20 m, upper rotor +0.34 m.
    obstacle_margin: 0.025
    report_dir: "demo_runs"
delivery_detector:
  ros__parameters:
    required_frames: 3
    min_inliers: 8
